{{- range $service, $val := .Values.services }}
{{- if and .deploy (ne $service "ebpfSandbox") }}
---
apiVersion: v1
kind: Pod
metadata:
  name: "{{ .name }}-test"
  namespace: {{ include "install.namespace" $ }}
  labels:
    {{- include "application.labels" $ | nindent 4 }}
    {{- include "application.selectorLabels" (merge (dict "name" .name) $) | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: connection-test
      image: busybox
      command: ['nc']
      args: ['-z', '-w3', '{{ .name }}', '{{ include "service.port" $ }}']
  restartPolicy: Never
{{- end }}
{{- end }}
